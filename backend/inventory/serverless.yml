service: inventory

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 256
  timeout: 10
  environment:
    SUPABASE_URL: ${ssm:/inventory/${self:provider.stage}/supabase-url}
    SUPABASE_SERVICE_ROLE_KEY: ${ssm:/inventory/${self:provider.stage}/supabase-service-role-key}
    SUPABASE_JWT_SECRET: ${ssm:/inventory/${self:provider.stage}/supabase-jwt-secret}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter/inventory/${self:provider.stage}/*
  httpApi:
    authorizers:
      jwtAuthorizer:
        type: request
        functionName: jwtAuthorizer
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    exclude:
      - aws-sdk
    target: node20
    platform: node
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3002

functions:
  # JWT Authorizer
  jwtAuthorizer:
    handler: src/authorizers/jwtAuthorizer.handler

  # Product Endpoints
  getProducts:
    handler: src/functions/getProducts.handler
    events:
      - httpApi:
          path: /products
          method: get
          # authorizer:
          #   name: jwtAuthorizer

  createProduct:
    handler: src/functions/createProduct.handler
    events:
      - httpApi:
          path: /products
          method: post
          # authorizer:
          #   name: jwtAuthorizer

  getProduct:
    handler: src/functions/getProduct.handler
    events:
      - httpApi:
          path: /products/{productId}
          method: get
          # authorizer:
          #   name: jwtAuthorizer

  updateProduct:
    handler: src/functions/updateProduct.handler
    events:
      - httpApi:
          path: /products/{productId}
          method: put
          # authorizer:
          #   name: jwtAuthorizer

  # Variant Endpoints
  createVariant:
    handler: src/functions/createVariant.handler
    events:
      - httpApi:
          path: /variants
          method: post
          authorizer:
            name: jwtAuthorizer

  # Inventory Endpoints
  addStock:
    handler: src/functions/addStock.handler
    events:
      - httpApi:
          path: /inventory/add-stock
          method: post
          authorizer:
            name: jwtAuthorizer

  removeStock:
    handler: src/functions/removeStock.handler
    events:
      - httpApi:
          path: /inventory/remove-stock
          method: post
          authorizer:
            name: jwtAuthorizer

  getLowStock:
    handler: src/functions/getLowStock.handler
    events:
      - httpApi:
          path: /inventory/low-stock
          method: get
          authorizer:
            name: jwtAuthorizer
