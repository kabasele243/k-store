service: inventory

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 256
  timeout: 10
  environment:
    SUPABASE_URL: ${ssm:/inventory/${self:provider.stage}/supabase-url}
    SUPABASE_SERVICE_ROLE_KEY: ${ssm:/inventory/${self:provider.stage}/supabase-service-role-key}
    SUPABASE_JWT_SECRET: ${ssm:/inventory/${self:provider.stage}/supabase-jwt-secret}
    INVENTORY_ASSETS_BUCKET: !Ref InventoryAssetsBucket
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter/inventory/${self:provider.stage}/*
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:PutObjectAcl
          Resource:
            - !Sub '${InventoryAssetsBucket.Arn}/*'
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource:
            - !GetAtt InventoryAssetsBucket.Arn
  httpApi:
    authorizers:
      jwtAuthorizer:
        type: request
        functionName: jwtAuthorizer
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    exclude:
      - aws-sdk
    target: node20
    platform: node
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3002

functions:
  # JWT Authorizer
  jwtAuthorizer:
    handler: src/authorizers/jwtAuthorizer.handler

  # Product Endpoints
  getProducts:
    handler: src/handlers/products/getProducts.handler
    events:
      - httpApi:
          path: /products
          method: GET
          # authorizer:
          #   name: jwtAuthorizer

  getProduct:
    handler: src/handlers/products/getProduct.handler
    events:
      - httpApi:
          path: /products/{productId}
          method: GET
          # authorizer:
          #   name: jwtAuthorizer

  # Sales Endpoints
  recordSales:
    handler: src/handlers/sales/recordSales.handler
    events:
      - httpApi:
          path: /sales/record
          method: POST
          # authorizer:
          #   name: jwtAuthorizer

  recordSale:
    handler: src/handlers/sales/recordSale.handler
    events:
      - httpApi:
          path: /sales/record-one
          method: POST
          authorizer:
            name: jwtAuthorizer

  getSalesReport:
    handler: src/handlers/sales/getSalesReport.handler
    events:
      - httpApi:
          path: /sales/report
          method: GET
          authorizer:
            name: jwtAuthorizer

  # Upload Endpoints
  generatePresignedUrls:
    handler: src/handlers/uploads/generatePresignedUrls.handler
    events:
      - httpApi:
          path: /uploads/presigned-urls
          method: POST
          # authorizer:
          #   name: jwtAuthorizer

  # Business Endpoints
  getBusinesses:
    handler: src/handlers/businesses/getBusinesses.handler
    events:
      - httpApi:
          path: /businesses
          method: GET
          # authorizer:
          #   name: jwtAuthorizer

  getBusinessById:
    handler: src/handlers/businesses/getBusinessById.handler
    events:
      - httpApi:
          path: /businesses/{id}
          method: GET
          # authorizer:
          #   name: jwtAuthorizer

  # Variant Endpoints
  updateVariant:
    handler: src/handlers/variants/updateVariant.handler
    events:
      - httpApi:
          path: /variants/{variantId}
          method: PUT
          # authorizer:
          #   name: jwtAuthorizer


resources:
  Resources:
    InventoryAssetsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-assets-${self:provider.stage}-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - '*'
              AllowedHeaders:
                - '*'
              AllowedMethods:
                - GET
                - PUT
                - POST
                - DELETE
                - HEAD
              MaxAge: 3000

    InventoryAssetsBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref InventoryAssetsBucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: '*'
              Action:
                - s3:GetObject
              Resource: !Sub '${InventoryAssetsBucket.Arn}/*'
